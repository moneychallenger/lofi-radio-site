<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lofi Radio Stream</title>
    
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons for minimalist playback controls -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts (Inter for clean UI) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrolling */
            background-color: #000;
        }

        /* Exact background styling requested */
        .bg-img {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -2;
            object-fit: cover;
            transition: opacity 2s ease-in-out;
        }

        /* Glassmorphism utility for the pill bar */
        .glass-pill {
            background: rgba(20, 20, 20, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        /* Vinyl record center hole */
        .vinyl-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background-color: rgba(20, 20, 20, 0.8);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Custom slow spin animation for the active record */
        .spin-slow {
            animation: spin 6s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Text shadow for better visibility on bright backgrounds */
        .text-shadow {
            text-shadow: 0px 2px 10px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body class="text-white selection:bg-white/30 antialiased">

    <!-- Splash Screen: Required to bypass browser autoplay policies gracefully -->
    <div id="splash" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/80 backdrop-blur-md transition-opacity duration-700">
        <h1 class="text-4xl font-semibold tracking-wide mb-8">Lofi Radio</h1>
        <button id="splash-btn" disabled class="px-8 py-3 bg-white text-black font-medium rounded-full shadow-lg hover:scale-105 transition-all opacity-50 cursor-not-allowed">
            Loading Player...
        </button>
    </div>

    <!-- Background Images Container -->
    <!-- Image 1 (Visible by default) -->
    <img id="bg1" class="bg-img opacity-100" src="make_this_image_into_a_animati.webp" alt="Lofi Background 1" onerror="this.src='https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80'">
    <!-- Image 2 (Hidden by default) -->
    <img id="bg2" class="bg-img opacity-0" src="make_this_image_into_a_animati (1) (1).webp" alt="Lofi Background 2" onerror="this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80'">

    <!-- Top-Left Corner: Live Clock -->
    <div class="fixed top-8 left-8 z-10 select-none">
        <div class="flex items-baseline gap-1 text-shadow">
            <span id="clock-time" class="text-5xl font-light tracking-tight">--:--</span>
            <span id="clock-ampm" class="text-xl font-medium text-white/80"></span>
        </div>
    </div>

    <!-- Bottom Center: Frosted Glass Pill Bar -->
    <div class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[92%] max-w-2xl glass-pill rounded-[2.5rem] px-5 py-4 flex items-center justify-between z-40">
        
        <!-- Left Side: Track Info & Album Art -->
        <div class="flex items-center gap-4 flex-1 overflow-hidden pr-4">
            
            <!-- Spinning Album Art Thumbnail -->
            <div class="relative w-16 h-16 rounded-full overflow-hidden shrink-0 border border-white/20 shadow-md">
                <img id="album-art" src="https://placehold.co/150x150/1a1a1a/ffffff?text=Lofi" alt="Album Art" class="w-full h-full object-cover transition-transform duration-500">
                <div class="vinyl-center"></div>
            </div>

            <!-- Title, Subtitle, and Progress Bar -->
            <div class="flex flex-col justify-center flex-1 min-w-0">
                <div id="track-title" class="truncate text-base font-semibold tracking-wide">Connecting to stream...</div>
                <div id="track-artist" class="truncate text-sm text-gray-300 mb-2">Fetching playlist info</div>
                
                <!-- Horizontal Progress Bar -->
                <div class="w-full h-1.5 bg-white/20 rounded-full overflow-hidden flex items-center">
                    <div id="progress-fill" class="h-full bg-white w-0 transition-all duration-300 ease-linear rounded-full"></div>
                </div>
            </div>
        </div>

        <!-- Right Side: Minimalist Controls -->
        <div class="flex items-center gap-5 shrink-0 pl-2">
            <!-- Previous Button -->
            <button id="btn-prev" class="text-white/70 hover:text-white hover:scale-110 transition-all focus:outline-none">
                <i class="ph ph-skip-back-circle text-4xl"></i>
            </button>
            
            <!-- Play/Pause Button (Solid white circle) -->
            <button id="btn-playpause" class="w-14 h-14 bg-white text-black rounded-full flex items-center justify-center hover:scale-105 hover:bg-gray-100 transition-all shadow-lg focus:outline-none">
                <i id="icon-playpause" class="ph-fill ph-play text-2xl ml-1"></i> <!-- ml-1 to visually center the play triangle -->
            </button>
            
            <!-- Next Button -->
            <button id="btn-next" class="text-white/70 hover:text-white hover:scale-110 transition-all focus:outline-none">
                <i class="ph ph-skip-forward-circle text-4xl"></i>
            </button>
        </div>
    </div>

    <!-- Hidden YouTube Player Container -->
    <div id="ytplayer" class="hidden absolute opacity-0 pointer-events-none"></div>

    <script>
        // --- 1. Clock Logic ---
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            minutes = minutes < 10 ? '0' + minutes : minutes;
            
            document.getElementById('clock-time').innerText = `${hours}:${minutes}`;
            document.getElementById('clock-ampm').innerText = ampm;
        }
        setInterval(updateClock, 1000);
        updateClock(); // Initial call

        // --- 2. Background Image Crossfader (30 mins) ---
        const BG_INTERVAL_MS = 30 * 60 * 1000; // 30 minutes in milliseconds
        let showingBg1 = true;
        
        setInterval(() => {
            const bg1 = document.getElementById('bg1');
            const bg2 = document.getElementById('bg2');
            
            if (showingBg1) {
                bg1.style.opacity = '0';
                bg2.style.opacity = '1';
            } else {
                bg1.style.opacity = '1';
                bg2.style.opacity = '0';
            }
            showingBg1 = !showingBg1;
        }, BG_INTERVAL_MS);

        // --- 3. YouTube Iframe API Integration ---
        let player;
        let isReady = false;
        let isPlaying = false;
        let progressInterval;

        // Dynamically load the YouTube Iframe API script
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytplayer', {
                height: '0',
                width: '0',
                playerVars: {
                    listType: 'playlist',
                    list: 'PL735nzlwLB47cmb2kjt-lJXPYU9fZS6Ru', // The requested Playlist ID
                    autoplay: 0,
                    controls: 0,
                    disablekb: 1,
                    fs: 0,
                    modestbranding: 1,
                    playsinline: 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            isReady = true;
            // Enable the Splash Screen button
            const splashBtn = document.getElementById('splash-btn');
            splashBtn.innerText = "Enter Station";
            splashBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            splashBtn.disabled = false;
        }

        function onPlayerStateChange(event) {
            const albumArt = document.getElementById('album-art');
            const playIcon = document.getElementById('icon-playpause');
            
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                
                // Update icons and animations
                playIcon.classList.remove('ph-play');
                playIcon.classList.add('ph-pause');
                playIcon.classList.remove('ml-1'); // Remove centering offset for pause icon
                albumArt.classList.add('spin-slow');
                
                updateTrackMetadata();
                startProgressTracker();
            } else {
                isPlaying = false;
                
                // Pause icons and animations
                playIcon.classList.remove('ph-pause');
                playIcon.classList.add('ph-play');
                playIcon.classList.add('ml-1'); 
                albumArt.classList.remove('spin-slow');
                
                stopProgressTracker();
            }
        }

        function updateTrackMetadata() {
            if (!player || !player.getVideoData) return;
            
            const data = player.getVideoData();
            if (data && data.title) {
                // Remove generic terms from typical YouTube lofi streams if desired, or keep as is.
                document.getElementById('track-title').innerText = data.title;
                document.getElementById('track-artist').innerText = data.author || "Lofi Radio Stream";
                
                // Fetch highest quality thumbnail via YouTube img server
                const videoId = data.video_id;
                if (videoId) {
                    const thumbUrl = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
                    // Fallback to hqdefault if maxres doesn't exist
                    document.getElementById('album-art').src = thumbUrl;
                    document.getElementById('album-art').onerror = function() {
                        this.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
                    };
                }
            }
        }

        function startProgressTracker() {
            stopProgressTracker();
            progressInterval = setInterval(() => {
                if (player && player.getCurrentTime && player.getDuration) {
                    const current = player.getCurrentTime();
                    const duration = player.getDuration();
                    if (duration > 0) {
                        const percent = (current / duration) * 100;
                        document.getElementById('progress-fill').style.width = `${percent}%`;
                    }
                }
            }, 500);
        }

        function stopProgressTracker() {
            if (progressInterval) {
                clearInterval(progressInterval);
            }
        }

        // --- 4. Event Listeners ---
        // Splash Screen Enter
        document.getElementById('splash-btn').addEventListener('click', () => {
            if (isReady) {
                document.getElementById('splash').classList.add('opacity-0', 'pointer-events-none');
                player.playVideo();
            }
        });

        // Play/Pause Button
        document.getElementById('btn-playpause').addEventListener('click', () => {
            if (!isReady) return;
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        });

        // Previous Track
        document.getElementById('btn-prev').addEventListener('click', () => {
            if (isReady) player.previousVideo();
        });

        // Next Track
        document.getElementById('btn-next').addEventListener('click', () => {
            if (isReady) player.nextVideo();
        });
    </script>
</body>
</html>
