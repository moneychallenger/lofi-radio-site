<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lofi Streamer</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace; color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        #bg-video {
            position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%;
            z-index: -2; object-fit: cover;
            transition: opacity 1s ease-in-out;
        }
        .overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; z-index: 1;
        }
        button {
            background-color: transparent; border: 2px solid #fff; color: #fff;
            padding: 12px 24px; font-size: 1.1em; cursor: pointer; border-radius: 30px;
            text-transform: uppercase; margin: 10px; transition: all 0.2s ease;
        }
        button:hover { background-color: rgba(255,255,255,0.2); }
        
        /* The invisible box for the YouTube player */
        #youtube-player-container {
            position: absolute; top: -9999px; left: -9999px; visibility: hidden;
        }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline id="bg-video">
        <source src="video1.mp4" type="video/mp4">
    </video>

    <div class="overlay">
        <h1>STATION STREAM</h1>
        <p>YouTube Playlist Radio</p>
        <button onclick="playMusic()">Start Radio</button>
        <button onclick="nextTrack()">Next Song</button>
    </div>

    <!-- THIS WAS MISSING! -->
    <div id="youtube-player-container">
        <div id="youtube-player"></div>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '10', width: '10',
                playerVars: {
                    'listType': 'playlist',
                    'list': 'PL735nzlwLB47cmb2kjt-lJXPYU9fZS6Ru',
                    'autoplay': 0, 'controls': 0, 'loop': 1, 'modestbranding': 1
                }
            });
        }

        function playMusic() {
            if (player && typeof player.playVideo === 'function') {
                player.playVideo();
                document.querySelector('.overlay p').innerText = "STREAMING ACTIVE";
            } else {
                document.querySelector('.overlay p').innerText = "LOADING PLAYER... CLICK AGAIN";
            }
        }
        
        function nextTrack() {
            if (player && typeof player.nextVideo === 'function') {
                player.nextVideo();
            }
        }

        const bgVideoElement = document.getElementById('bg-video');
        const playlistVideos = ['video1.mp4', 'video2.mp4'];
        let currentVideoIndex = 0;
        const THIRTY_MINUTES = 30 * 60 * 1000; 

        setInterval(function() {
            currentVideoIndex = (currentVideoIndex + 1) % playlistVideos.length;
            bgVideoElement.style.opacity = 0;
            setTimeout(function() {
                bgVideoElement.src = playlistVideos[currentVideoIndex];
                bgVideoElement.load();
                bgVideoElement.play();
                bgVideoElement.style.opacity = 1;
            }, 1000); 
        }, THIRTY_MINUTES);
    </script>
</body>
</html>
