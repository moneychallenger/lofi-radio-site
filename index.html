<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lofi Streamer</title>
    <style>
        /* Base Setup */
        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background-color: #1a1a2e;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #bg-video {
            position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%;
            z-index: -2; object-fit: cover;
            transition: opacity 1s ease-in-out;
        }

        /* Live Clock (Top Left Corner) */
        .live-clock {
            position: absolute; top: 30px; left: 40px;
            color: rgba(255, 255, 255, 0.9); font-size: 22px; font-weight: 500;
            letter-spacing: 1px; z-index: 1; text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        }

        /* The Pill-Shaped Bottom Bar */
        .player-bar {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 800px; max-width: 90%; height: 75px;
            background: rgba(20, 20, 20, 0.4); backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 25px; box-sizing: border-box; z-index: 1; color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .track-info { display: flex; align-items: center; gap: 15px; width: 65%; }

        .album-art {
            width: 45px; height: 45px; border-radius: 50%;
            background-image: url('https://images.unsplash.com/photo-1614165936126-22485bb5a52b?q=80&w=200&auto=format&fit=crop'); 
            background-size: cover; background-position: center;
            animation: spin 8s linear infinite; animation-play-state: paused; 
        }
        .album-art.playing { animation-play-state: running; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .track-details { display: flex; flex-direction: column; flex-grow: 1; justify-content: center; overflow: hidden; }

        .track-title {
            font-size: 15px; font-weight: 600; margin: 0 0 2px 0; letter-spacing: 0.5px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; /* Keeps long titles tidy */
        }

        .track-artist { font-size: 11px; color: #b3b3b3; margin: 0 0 6px 0; }

        .progress-container { display: flex; align-items: center; gap: 10px; }
        .time-text { font-size: 10px; color: #b3b3b3; min-width: 25px; }
        .progress-bar-bg { flex-grow: 1; height: 3px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; position: relative; }
        .progress-bar-fill { position: absolute; left: 0; top: 0; height: 100%; background: #fff; width: 0%; border-radius: 2px; transition: width 1s linear; }

        .controls { display: flex; align-items: center; gap: 15px; }
        .ctrl-btn {
            background: none; border: none; color: #fff; cursor: pointer;
            font-size: 14px; display: flex; justify-content: center; align-items: center;
            opacity: 0.7; transition: opacity 0.2s, transform 0.1s; padding: 0;
        }
        .ctrl-btn:hover { opacity: 1; }
        .ctrl-btn:active { transform: scale(0.9); }

        .play-pause-btn {
            width: 36px; height: 36px; background: #fff; color: #000;
            border-radius: 50%; font-size: 16px; opacity: 1; padding-left: 2px; 
        }
        .play-pause-btn.is-playing { padding-left: 0; }

        #youtube-player-container { position: absolute; top: -9999px; left: -9999px; visibility: hidden; }
    </style>
</head>
<body>

    <div class="live-clock" id="live-clock">00:00 AM</div>

    <video autoplay loop muted playsinline id="bg-video">
        <source src="video1.mp4" type="video/mp4">
    </video>

    <div class="player-bar">
        <div class="track-info">
            <div class="album-art" id="art"></div>
            <div class="track-details">
                <!-- Song title updates live here -->
                <div class="track-title" id="song-title">Click Play to Start</div>
                <div class="track-artist">YouTube Playlist</div>
                <div class="progress-container">
                    <span class="time-text" id="current-time">0:00</span>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progress-fill"></div>
                    </div>
                    <span class="time-text" id="total-time">0:00</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
            <button class="ctrl-btn play-pause-btn" id="play-btn" onclick="togglePlay()">▶</button>
            <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
        </div>
    </div>

    <div id="youtube-player-container">
        <div id="youtube-player"></div>
    </div>

    <script>
        // Clock Script
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12; hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('live-clock').innerText = hours + ':' + minutes + ' ' + ampm;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // YouTube API Script
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var isPlaying = false;
        var progressInterval;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '10', width: '10',
                playerVars: {
                    'listType': 'playlist',
                    'list': 'PL735nzlwLB47cmb2kjt-lJXPYU9fZS6Ru',
                    'autoplay': 0, 'controls': 0, 'loop': 1, 'modestbranding': 1
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function formatTime(time) {
            if (isNaN(time)) return "0:00";
            const minutes = Math.floor(time / 60);
            const seconds = Math.floor(time % 60);
            return minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
        }

        // Updates progress bar and pulls the active song title from YouTube
        function updatePlayerInfo() {
            if (player && player.getCurrentTime) {
                const current = player.getCurrentTime();
                const duration = player.getDuration();
                
                document.getElementById('current-time').innerText = formatTime(current);
                document.getElementById('total-time').innerText = formatTime(duration);
                
                if (duration > 0) {
                    const percentage = (current / duration) * 100;
                    document.getElementById('progress-fill').style.width = percentage + "%";
                }

                // Grabs the real-time song title directly from YouTube video data
                if (typeof player.getVideoData === 'function') {
                    const videoData = player.getVideoData();
                    if (videoData && videoData.title) {
                        document.getElementById('song-title').innerText = videoData.title;
                    }
                }
            }
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                isPlaying = true;
                updateUIForPlay();
                progressInterval = setInterval(updatePlayerInfo, 1000);
            } else {
                isPlaying = false;
                updateUIForPause();
                clearInterval(progressInterval);
            }
        }

        function updateUIForPlay() {
            const cd = document.getElementById('art');
            const playBtn = document.getElementById('play-btn');
            playBtn.innerHTML = "⏸"; 
            playBtn.classList.add('is-playing');
            cd.classList.add('playing');
        }

        function updateUIForPause() {
            const cd = document.getElementById('art');
            const playBtn = document.getElementById('play-btn');
            playBtn.innerHTML = "▶"; 
            playBtn.classList.remove('is-playing');
            cd.classList.remove('playing');
        }

        function togglePlay() {
            if (player && typeof player.playVideo === 'function') {
                if (isPlaying) { player.pauseVideo(); } 
                else { player.playVideo(); }
            }
        }
        
        function nextTrack() { if (player && typeof player.nextVideo === 'function') { player.nextVideo(); } }
        function prevTrack() { if (player && typeof player.previousVideo === 'function') { player.previousVideo(); } }

        // Background Video 30-Minute Switcher
        const bgVideoElement = document.getElementById('bg-video');
        const playlistVideos = ['video1.mp4', 'video2.mp4'];
        let currentVideoIndex = 0;
        const THIRTY_MINUTES = 30 * 60 * 1000; 

        setInterval(function() {
            currentVideoIndex = (currentVideoIndex + 1) % playlistVideos.length;
            bgVideoElement.style.opacity = 0;
            setTimeout(function() {
                bgVideoElement.src = playlistVideos[currentVideoIndex];
                bgVideoElement.load();
                bgVideoElement.play();
                bgVideoElement.style.opacity = 1;
            }, 1000); 
        }, THIRTY_MINUTES);
    </script>
</body>
</html>
