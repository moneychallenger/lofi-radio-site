<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lofi Radio Station</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Base Styles */
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #000; }
        
        /* 1. Cinematic Blur Backgrounds */
        .bg-blur {
            position: fixed;
            top: -5%; left: -5%;
            width: 110vw; height: 110vh;
            z-index: -3;
            object-fit: cover;
            filter: blur(25px) brightness(0.3);
        }

        /* 2. Sharp Main Video */
        .main-vid {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -2;
            object-fit: contain; 
            object-position: center center;
        }

        /* Video Orientation Toggle */
        @media (orientation: landscape) {
            .portrait-vid { display: none; }
            .landscape-vid { display: block; }
        }
        @media (orientation: portrait) {
            .landscape-vid { display: none; }
            .portrait-vid { display: block; }
        }

        /* --- THE DYNAMIC WOODEN SHELVES --- */
        .shelf {
            position: absolute;
            z-index: 10;
            display: none; 
            background-color: #2b180d;
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 2px, transparent 2px, transparent 4px);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            overflow: auto;
        }

        /* Left Shelf - Laptop */
        #shelf-left {
            top: 0; left: 0; height: 100vh;
            flex-direction: column;
            border-right: 4px solid #111;
            box-shadow: inset -15px 0 25px -5px rgba(255, 170, 50, 0.6), inset -2px 0 5px rgba(255, 220, 120, 0.9);
            padding: 20px 0; padding-right: 15px;
        }

        /* Right Shelf - Laptop */
        #shelf-right {
            top: 0; right: 0; height: 100vh;
            flex-direction: column;
            border-left: 4px solid #111;
            box-shadow: inset 15px 0 25px -5px rgba(255, 170, 50, 0.6), inset 2px 0 5px rgba(255, 220, 120, 0.9);
            padding: 20px 0; padding-left: 15px;
        }

        /* Top Shelf - Phone */
        #shelf-top {
            top: 0; left: 0; width: 100vw;
            flex-direction: row;
            border-bottom: 4px solid #111;
            box-shadow: inset 0 -15px 25px -5px rgba(255, 170, 50, 0.6), inset 0 -2px 5px rgba(255, 220, 120, 0.9);
            padding: 0 20px; padding-bottom: 10px;
        }

        /* Custom Scrollbar for Shelves */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        ::-webkit-scrollbar-thumb { background: #6b442a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #8c5b3a; }

        /* The Vinyl Record Disks (UPDATED TO BE FLUID AND RESIZE AUTOMATICALLY) */
        .disk-wrapper { 
            flex-shrink: 0; 
            height: 80%; /* Automatically scales based on the height of the shelf! */
            aspect-ratio: 1 / 1; /* Keeps it a perfect circle */
            max-height: 90px;
            max-width: 90px;
            margin: 0 auto;
        }
        .disk {
            width: 100%; height: 100%;
            border-radius: 50%;
            background-color: #050505;
            border: 2px solid #222;
            box-shadow: 0 6px 15px rgba(0,0,0,0.9), inset 0 0 10px rgba(255,200,100,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .disk img { width: 65%; height: 65%; border-radius: 50%; object-fit: cover; pointer-events: none; }
        .disk::after { content: ''; position: absolute; width: 10px; height: 10px; background: #1a0b05; border-radius: 50%; border: 1px solid #000; }
        .disk:hover { transform: scale(1.15) rotate(15deg); box-shadow: 0 10px 20px rgba(0,0,0,1), 0 0 20px rgba(255, 170, 50, 0.5); border-color: #444; }

        /* Frosted Glass UI */
        .frosted-glass {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6); z-index: 20;
        }

        .spin-slow { animation: spin 4s linear infinite; }
        .spin-paused { animation-play-state: paused; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Splash Screen */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 50; display: flex; align-items: center; justify-content: center; flex-direction: column; color: white; transition: opacity 0.5s;
        }
    </style>
</head>
<body class="text-white">

    <div id="splash">
        <h1 class="text-3xl font-bold mb-6 tracking-wider">LOFI STATION</h1>
        <button id="enter-btn" class="px-8 py-3 bg-white text-black font-semibold rounded-full hover:bg-gray-200 transition">Enter Station</button>
    </div>

    <!-- Blurred Backgrounds -->
    <video src="landscape.mp4" autoplay loop muted playsinline class="bg-blur landscape-vid"></video>
    <video src="potrate.mp4" autoplay loop muted playsinline class="bg-blur portrait-vid"></video>

    <!-- Sharp Main Videos -->
    <video id="main-landscape" src="landscape.mp4" autoplay loop muted playsinline class="main-vid landscape-vid"></video>
    <video id="main-portrait" src="potrate.mp4" autoplay loop muted playsinline class="main-vid portrait-vid"></video>

    <!-- Dynamic Auto-Sizing Shelves -->
    <div id="shelf-left" class="shelf"></div>
    <div id="shelf-right" class="shelf"></div>
    <div id="shelf-top" class="shelf"></div>

    <!-- UI: Clock -->
    <div class="absolute top-4 left-4 sm:top-6 sm:left-6 frosted-glass px-4 py-2 rounded-xl">
        <span id="clock" class="text-lg sm:text-2xl font-semibold tracking-wide drop-shadow-md">00:00 AM</span>
    </div>

    <!-- UI: Player Bar -->
    <div class="absolute bottom-4 sm:bottom-6 w-full flex justify-center px-4 z-20">
        <div class="frosted-glass w-full max-w-2xl rounded-full flex items-center justify-between p-3 sm:p-4">
            <div class="flex items-center space-x-3 sm:space-x-4 overflow-hidden w-2/3">
                <img id="album-art" src="https://via.placeholder.com/150" alt="Album Art" class="w-10 h-10 sm:w-14 sm:h-14 rounded-full object-cover spin-paused">
                <div class="flex flex-col w-full">
                    <span id="song-title" class="text-sm sm:text-base font-bold truncate">Loading Stream...</span>
                    <span id="song-artist" class="text-xs sm:text-sm text-gray-300 truncate">Connecting to YouTube</span>
                    <div id="progress-container" class="w-full h-1 bg-gray-600 rounded-full mt-1.5 overflow-hidden cursor-pointer hover:h-2 transition-all duration-200">
                        <div id="progress-fill" class="h-full bg-white w-0 transition-all duration-1000 ease-linear pointer-events-none"></div>
                    </div>
                </div>
            </div>
            <div class="flex items-center space-x-3 sm:space-x-5 pr-2 sm:pr-4">
                <button id="prev" class="text-gray-300 hover:text-white transition focus:outline-none"><i class="fas fa-step-backward text-sm sm:text-lg"></i></button>
                <button id="play-pause" class="w-10 h-10 sm:w-12 sm:h-12 bg-white text-black rounded-full flex items-center justify-center hover:scale-105 transition focus:outline-none"><i id="play-icon" class="fas fa-play ml-1"></i></button>
                <button id="next" class="text-gray-300 hover:text-white transition focus:outline-none"><i class="fas fa-step-forward text-sm sm:text-lg"></i></button>
            </div>
        </div>
    </div>

    <!-- Hidden YouTube Player -->
    <div id="yt-player" class="hidden"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // --- LIVE CLOCK ---
        setInterval(() => {
            const now = new Date();
            let hours = now.getHours(), minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            document.getElementById('clock').innerText = hours + ':' + (minutes < 10 ? '0' + minutes : minutes) + ' ' + ampm;
        }, 1000);

        // --- AUTO-DETECT BLURRED AREA (FIXED FOR ALL SCREENS) ---
        function calculateShelves() {
            const isLandscape = window.innerWidth > window.innerHeight;
            const video = isLandscape ? document.getElementById('main-landscape') : document.getElementById('main-portrait');
            
            if (!video || !video.videoWidth) return;

            const winW = window.innerWidth;
            const winH = window.innerHeight;
            const winAR = winW / winH;
            const vidAR = video.videoWidth / video.videoHeight;

            const shelfLeft = document.getElementById('shelf-left');
            const shelfRight = document.getElementById('shelf-right');
            const shelfTop = document.getElementById('shelf-top');
            
            // Lowered the requirement so the shelf always appears if there is an ugly black bar!
            const MIN_SHELF_SIZE = 30; 

            shelfLeft.style.display = 'none'; shelfRight.style.display = 'none'; shelfTop.style.display = 'none';

            if (winAR > vidAR + 0.02) {
                // Pillowboxes on Left & Right
                const vidRenderW = winH * vidAR;
                const blankW = (winW - vidRenderW) / 2;
                
                if (blankW >= MIN_SHELF_SIZE) {
                    shelfLeft.style.display = 'flex'; shelfLeft.style.width = `${blankW}px`;
                    shelfRight.style.display = 'flex'; shelfRight.style.width = `${blankW}px`;
                }
            } else if (winAR < vidAR - 0.02) {
                // Letterbox on Top
                const vidRenderH = winW / vidAR;
                const blankH = (winH - vidRenderH) / 2;
                
                if (blankH >= MIN_SHELF_SIZE) {
                    shelfTop.style.display = 'flex'; shelfTop.style.height = `${blankH}px`;
                }
            }
        }

        window.addEventListener('resize', calculateShelves);
        document.querySelectorAll('.main-vid').forEach(v => {
            v.addEventListener('loadedmetadata', calculateShelves);
            if (v.readyState >= 1) calculateShelves(); 
        });

        // --- YOUTUBE PLAYER LOGIC ---
        let player, isPlaying = false, progressInterval, shelvesBuilt = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '0', width: '0',
                playerVars: { listType: 'playlist', list: 'PLblc3VxTs80U', autoplay: 0, controls: 0, disablekb: 1, fs: 0 },
                events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerReady() {
            document.getElementById('enter-btn').addEventListener('click', () => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => document.getElementById('splash').style.display = 'none', 500);
                player.setVolume(70); player.setShuffle(true); player.playVideo();
            });
            
            document.getElementById('play-pause').addEventListener('click', () => isPlaying ? player.pauseVideo() : player.playVideo());
            document.getElementById('prev').addEventListener('click', () => player.previousVideo());
            document.getElementById('next').addEventListener('click', () => player.nextVideo());

            document.getElementById('progress-container').addEventListener('click', function(e) {
                if(player && player.getDuration) {
                    const rect = this.getBoundingClientRect();
                    player.seekTo(( (e.clientX - rect.left) / rect.width ) * player.getDuration(), true);
                }
            });
        }

        function buildShelves() {
            const playlist = player.getPlaylist();
            if (!playlist || playlist.length === 0) return; 

            const createDisk = (index, vidId) => {
                const w = document.createElement('div'); w.className = 'disk-wrapper';
                const d = document.createElement('div'); d.className = 'disk'; d.title = "Play Song";
                d.onclick = () => player.playVideoAt(index);
                const i = document.createElement('img'); i.src = 'https://img.youtube.com/vi/' + vidId + '/hqdefault.jpg';
                d.appendChild(i); w.appendChild(d); return w;
            };

            playlist.forEach((vidId, index) => {
                document.getElementById('shelf-top').appendChild(createDisk(index, vidId));
                if (index % 2 === 0) document.getElementById('shelf-left').appendChild(createDisk(index, vidId));
                else document.getElementById('shelf-right').appendChild(createDisk(index, vidId));
            });
            shelvesBuilt = true;
            setTimeout(calculateShelves, 100); 
        }

        function onPlayerStateChange(event) {
            const playIcon = document.getElementById('play-icon'), thumb = document.getElementById('album-art');
            if (event.data == YT.PlayerState.PLAYING) {
                isPlaying = true;
                if (!shelvesBuilt) buildShelves();
                playIcon.classList.replace('fa-play', 'fa-pause'); playIcon.classList.remove('ml-1'); 
                thumb.classList.replace('spin-paused', 'spin-slow');
                
                let data = player.getVideoData();
                document.getElementById('song-title').innerText = data.title;
                document.getElementById('song-artist').innerText = data.author;
                document.getElementById('album-art').src = 'https://img.youtube.com/vi/' + data.video_id + '/hqdefault.jpg';
                
                clearInterval(progressInterval);
                progressInterval = setInterval(() => {
                    if(player && player.getDuration) document.getElementById('progress-fill').style.width = ((player.getCurrentTime() / player.getDuration()) * 100) + '%';
                }, 1000);
            } else {
                isPlaying = false;
                playIcon.classList.replace('fa-pause', 'fa-play'); playIcon.classList.add('ml-1'); 
                thumb.classList.replace('spin-slow', 'spin-paused');
                clearInterval(progressInterval);
            }
        }
    </script>
</body>
</html>
