<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lofi Radio Station</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Base Styles */
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #000; }
        
        /* Background Crossfade Animation */
        .bg-asset {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -2;
            object-fit: cover;
            opacity: 0;
            transition: opacity 2s ease-in-out; /* Smooth 2-second crossfade */
        }
        .bg-asset.active {
            opacity: 1;
        }

        /* Frosted Glass UI */
        .frosted-glass {
            background: rgba(20, 20, 20, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        /* Spinning Album Art */
        .spin-slow {
            animation: spin 4s linear infinite;
        }
        .spin-paused {
            animation-play-state: paused;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Splash Screen */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 50; display: flex;
            align-items: center; justify-content: center; flex-direction: column;
            color: white; transition: opacity 0.5s;
        }
    </style>
</head>
<body class="text-white">

    <!-- Splash Screen (Required for browser autoplay policies) -->
    <div id="splash">
        <h1 class="text-3xl font-bold mb-6 tracking-wider">LOFI STATION</h1>
        <button id="enter-btn" class="px-8 py-3 bg-white text-black font-semibold rounded-full hover:bg-gray-200 transition">
            Enter Station
        </button>
    </div>

    <!-- Backgrounds (Video & Images updated to new filenames) -->
    <video id="bg-1" src="29444-375445500.mp4" autoplay loop muted playsinline class="bg-asset active"></video>
    <img id="bg-2" src="Gemini_Generated_Image_23zxp823zxp823zx.png" class="bg-asset">
    <img id="bg-3" src="Gemini_Generated_Image_e70psue70psue70p.png" class="bg-asset">

    <!-- Top Left Live Clock -->
    <div class="absolute top-6 left-6 frosted-glass px-4 py-2 rounded-xl">
        <span id="clock" class="text-lg sm:text-2xl font-semibold tracking-wide drop-shadow-md">00:00 AM</span>
    </div>

    <!-- Hidden YouTube Player -->
    <div id="yt-player" class="hidden"></div>

    <!-- Bottom Center Pill Bar -->
    <div class="absolute bottom-6 w-full flex justify-center px-4">
        <div class="frosted-glass w-full max-w-2xl rounded-full flex items-center justify-between p-3 sm:p-4">
            
            <!-- Left Side: Art & Metadata -->
            <div class="flex items-center space-x-3 sm:space-x-4 overflow-hidden w-2/3">
                <!-- Album Art Thumbnail -->
                <img id="album-art" src="https://via.placeholder.com/150" alt="Album Art" class="w-10 h-10 sm:w-14 sm:h-14 rounded-full object-cover spin-paused">
                
                <div class="flex flex-col w-full">
                    <!-- Dynamic Text -->
                    <span id="song-title" class="text-sm sm:text-base font-bold truncate">Loading Stream...</span>
                    <span id="song-artist" class="text-xs sm:text-sm text-gray-300 truncate">Connecting to YouTube</span>
                    
                    <!-- Progress Bar -->
                    <div class="w-full h-1 bg-gray-600 rounded-full mt-1.5 overflow-hidden">
                        <div id="progress-fill" class="h-full bg-white w-0 transition-all duration-1000 ease-linear"></div>
                    </div>
                </div>
            </div>

            <!-- Right Side: Controls -->
            <div class="flex items-center space-x-3 sm:space-x-5 pr-2 sm:pr-4">
                <button id="prev" class="text-gray-300 hover:text-white transition focus:outline-none">
                    <i class="fas fa-step-backward text-sm sm:text-lg"></i>
                </button>
                
                <button id="play-pause" class="w-10 h-10 sm:w-12 sm:h-12 bg-white text-black rounded-full flex items-center justify-center hover:scale-105 transition focus:outline-none">
                    <i id="play-icon" class="fas fa-play ml-1"></i>
                </button>
                
                <button id="next" class="text-gray-300 hover:text-white transition focus:outline-none">
                    <i class="fas fa-step-forward text-sm sm:text-lg"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // --- 1. Background Switcher (60 Seconds) ---
        const bgs = [
            document.getElementById('bg-1'),
            document.getElementById('bg-2'),
            document.getElementById('bg-3')
        ];
        let currentBg = 0;

        setInterval(() => {
            bgs[currentBg].classList.remove('active');
            currentBg = (currentBg + 1) % bgs.length;
            bgs[currentBg].classList.add('active');
            
            // If the active background is the video, ensure it stays playing
            if(bgs[currentBg].tagName === 'VIDEO') {
                bgs[currentBg].play();
            }
        }, 60000); // 60,000 milliseconds = 60 seconds

        // --- 2. Live Clock ---
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').innerText = hours + ':' + minutes + ' ' + ampm;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 3. YouTube Audio Player Logic ---
        let player;
        let isPlaying = false;
        let progressInterval;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '0', 
                width: '0',
                playerVars: {
                    listType: 'playlist',
                    list: 'PL735nzlwLB47cmb2kjt-lJXPYU9fZS6Ru',
                    autoplay: 0, 
                    controls: 0, 
                    disablekb: 1, 
                    fs: 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            // Remove Splash Screen & Start Audio on Click
            document.getElementById('enter-btn').addEventListener('click', () => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => { document.getElementById('splash').style.display = 'none'; }, 500);
                
                player.setVolume(70);
                player.setShuffle(true); // <--- This command shuffles your playlist!
                player.playVideo();
            });
            
            // Setup Control Buttons
            document.getElementById('play-pause').addEventListener('click', () => {
                if(isPlaying) player.pauseVideo();
                else player.playVideo();
            });
            
            document.getElementById('prev').addEventListener('click', () => player.previousVideo());
            document.getElementById('next').addEventListener('click', () => player.nextVideo());
        }

        function onPlayerStateChange(event) {
            const playIcon = document.getElementById('play-icon');
            const thumb = document.getElementById('album-art');
            
            if (event.data == YT.PlayerState.PLAYING) {
                isPlaying = true;
                
                // Update icons and animations
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
                playIcon.classList.remove('ml-1'); // fix center alignment for pause icon
                thumb.classList.remove('spin-paused');
                thumb.classList.add('spin-slow');
                
                // Pull live YouTube metadata (Title, Channel, Thumbnail)
                let data = player.getVideoData();
                document.getElementById('song-title').innerText = data.title;
                document.getElementById('song-artist').innerText = data.author;
                document.getElementById('album-art').src = 'https://img.youtube.com/vi/' + data.video_id + '/hqdefault.jpg';
                
                // Start tracking progress bar
                clearInterval(progressInterval);
                progressInterval = setInterval(updateProgress, 1000);
                
            } else {
                isPlaying = false;
                
                // Pause icons and animations
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                playIcon.classList.add('ml-1'); 
                thumb.classList.add('spin-paused');
                
                // Stop tracking progress bar
                clearInterval(progressInterval);
            }
        }

        function updateProgress() {
            if(player && player.getDuration) {
                const duration = player.getDuration();
                const current = player.getCurrentTime();
                const percent = (current / duration) * 100;
                document.getElementById('progress-fill').style.width = percent + '%';
            }
        }
    </script>
</body>
</html>
