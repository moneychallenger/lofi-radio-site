<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lofi & Gym Radio Station</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts: Poppins for Splash & UI, Inter for generic text -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styles & Universal Box Sizing */
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; background-color: #000; color: white; }
        
        /* --- 1. SPLASH SCREEN (Vibrant Geometric Theme) --- */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #FCFBF8; z-index: 50; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #000; transition: opacity 0.5s, visibility 0.5s; overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }
        
        .shape-1 { position: absolute; top: 10%; left: 5%; width: 180px; height: 180px; background-color: #007AFF; border-radius: 60px; border-top-right-radius: 10px; transform: rotate(-15deg); z-index: -1; }
        .shape-2 { position: absolute; bottom: 15%; right: 10%; width: 220px; height: 220px; background-color: #D4FF00; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: -1; }
        .shape-2::after { content: ''; width: 80px; height: 80px; background-color: #FF33A1; border-radius: 50%; }
        .shape-3 { position: absolute; top: 20%; right: 15%; width: 120px; height: 120px; background-color: #FF33A1; border-radius: 30px; border-bottom-left-radius: 0; transform: rotate(20deg); z-index: -1; }

        /* --- 2. ORIGINAL IMMERSIVE BACKGROUNDS --- */
        .bg-blur {
            position: fixed;
            top: -5%; left: -5%;
            width: 110dvw; height: 110dvh;
            z-index: -3;
            object-fit: cover;
            filter: blur(25px) brightness(0.3);
            transition: opacity 0.5s ease;
        }

        .main-vid {
            position: fixed;
            top: 0; left: 0;
            width: 100dvw; height: 100dvh;
            z-index: -2;
            transition: opacity 0.5s ease;
        }

        /* --- DEVICE SPECIFIC LAYOUTS --- */
        @media (orientation: landscape) {
            .portrait-vid { display: none !important; }
            .landscape-vid { display: block; }
            .main-vid.landscape-vid {
                object-fit: contain; 
                object-position: center center;
            }
        }
        
        @media (orientation: portrait) {
            .landscape-vid { display: none !important; }
            .portrait-vid { display: block; }
            .bg-blur.portrait-vid { display: none !important; } 
            .main-vid.portrait-vid {
                object-fit: cover; 
                object-position: top center; 
            }
            .shelf { display: none !important; } 
        }

        /* --- 3. ORIGINAL WOODEN SHELVES (Edge Extension Vibe) --- */
        .shelf {
            position: absolute;
            z-index: 10;
            display: none; 
            background-color: #2b180d;
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 2px, transparent 2px, transparent 4px);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            overflow: auto;
        }

        #shelf-left {
            top: 0; left: 0; height: 100dvh;
            flex-direction: column;
            border-right: 4px solid #111;
            box-shadow: inset -15px 0 25px -5px rgba(255, 170, 50, 0.6), inset -2px 0 5px rgba(255, 220, 120, 0.9);
            padding: 20px 0; padding-right: 15px;
        }

        #shelf-right {
            top: 0; right: 0; height: 100dvh;
            flex-direction: column;
            border-left: 4px solid #111;
            box-shadow: inset 15px 0 25px -5px rgba(255, 170, 50, 0.6), inset 2px 0 5px rgba(255, 220, 120, 0.9);
            padding: 20px 0; padding-left: 15px;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        ::-webkit-scrollbar-thumb { background: #6b442a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #8c5b3a; }

        .disk-wrapper { 
            flex-shrink: 0; width: 75%; aspect-ratio: 1 / 1; 
            max-height: 85px; max-width: 85px; margin: 0 auto;
        }
        .disk {
            width: 100%; height: 100%; border-radius: 50%;
            background-color: #050505; border: 2px solid #222;
            box-shadow: 0 6px 15px rgba(0,0,0,0.9), inset 0 0 10px rgba(255,200,100,0.1);
            cursor: pointer; transition: all 0.3s ease;
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .disk img { width: 65%; height: 65%; border-radius: 50%; object-fit: cover; pointer-events: none; }
        .disk::after { content: ''; position: absolute; width: 10px; height: 10px; background: #1a0b05; border-radius: 50%; border: 1px solid #000; }
        .disk:hover { transform: scale(1.15) rotate(15deg); box-shadow: 0 10px 20px rgba(0,0,0,1), 0 0 20px rgba(255, 170, 50, 0.5); border-color: #444; }

        /* --- 4. POP-ART UI (Frosted glass preserved, but styled brightly) --- */
        .pop-ui {
            background: rgba(252, 251, 248, 0.85); /* Light Cream Frosted */
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); 
            /* Notice I removed z-index from here so Tailwind's z-40 overrides properly */
            font-family: 'Poppins', sans-serif;
        }

        .spin-slow { animation: spin 4s linear infinite; }
        .spin-paused { animation-play-state: paused; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Bold, Vibrant Splash Screen (1st Page) -->
    <div id="splash">
        <div class="shape-1"></div>
        <div class="shape-2"></div>
        <div class="shape-3"></div>
        
        <h1 class="text-5xl md:text-8xl font-black mb-2 tracking-tighter text-black text-center z-10 px-4">STATION SELECT</h1>
        <p class="text-xl md:text-2xl font-bold text-[#007AFF] mb-10 z-10 text-center">Your vibes, satisfied.</p>
        <button id="enter-btn" class="px-10 py-4 bg-[#D4FF00] text-black font-extrabold text-lg md:text-xl rounded-full hover:scale-105 hover:bg-[#C5F013] transition shadow-[0_8px_20px_rgba(212,255,0,0.4)] z-10">Enter Station</button>
    </div>

    <!-- Blurred Backgrounds (Laptop Only) -->
    <video id="blur-landscape" src="landscape.mp4" autoplay loop muted playsinline class="bg-blur landscape-vid"></video>
    <video id="blur-portrait" src="potrate.mp4" autoplay loop muted playsinline class="bg-blur portrait-vid"></video>

    <!-- Sharp Main Videos -->
    <video id="main-landscape" src="landscape.mp4" autoplay loop muted playsinline class="main-vid landscape-vid"></video>
    <video id="main-portrait" src="potrate.mp4" autoplay loop muted playsinline class="main-vid portrait-vid"></video>

    <!-- Dynamic Auto-Sizing Shelves (Laptop Only) -->
    <div id="shelf-left" class="shelf"></div>
    <div id="shelf-right" class="shelf"></div>

    <!-- UI: Clock (Top Left) - Added z-40 to sit above shelves -->
    <div class="absolute top-4 left-4 sm:top-6 sm:left-6 pop-ui z-40 px-5 py-2.5 rounded-2xl">
        <span id="clock" class="text-base sm:text-xl font-bold tracking-tight text-black">00:00 AM</span>
    </div>

    <!-- UI: Theme Switcher (Top Right) - Added z-40 to fix hiding behind right shelf -->
    <div id="theme-switch-btn" class="absolute top-4 right-4 sm:top-6 sm:right-6 z-40 bg-[#007AFF] text-white px-5 py-2.5 rounded-2xl cursor-pointer hover:bg-[#005CE6] hover:-translate-y-1 transition-all duration-300 flex items-center font-bold text-sm sm:text-base shadow-[0_8px_20px_rgba(0,122,255,0.4)]" style="font-family: 'Poppins', sans-serif;">
        <i class="fas fa-dumbbell mr-2.5"></i> <span id="theme-btn-text">Switch to Gym</span>
    </div>

    <!-- UI: Player Bar - Changed to z-40 to keep it safe above everything -->
    <div class="absolute bottom-6 sm:bottom-10 w-full flex justify-center px-4 z-40">
        <div class="pop-ui w-full max-w-3xl rounded-[2rem] flex items-center justify-between p-3 sm:p-4 pr-4 sm:pr-6">
            
            <div class="flex items-center space-x-4 sm:space-x-5 overflow-hidden w-2/3 pl-1 sm:pl-2">
                <img id="album-art" src="https://via.placeholder.com/150" alt="Album Art" class="w-12 h-12 sm:w-14 sm:h-14 rounded-full object-cover spin-paused border-2 border-[#007AFF] shadow-md">
                <div class="flex flex-col w-full justify-center">
                    <span id="song-title" class="text-sm sm:text-base font-bold text-black truncate tracking-tight">Loading Stream...</span>
                    <span id="song-artist" class="text-xs sm:text-sm text-gray-500 font-semibold truncate mb-1.5" id="status-text">Connecting to YouTube</span>
                    
                    <!-- Progress Bar (Pop Pink) -->
                    <div id="progress-container" class="w-full h-2 bg-gray-200 rounded-full overflow-hidden cursor-pointer hover:h-3 transition-all duration-200">
                        <div id="progress-fill" class="h-full bg-[#FF33A1] w-0 transition-all duration-1000 ease-linear pointer-events-none rounded-full"></div>
                    </div>
                </div>
            </div>

            <!-- Controls (Pop Lime Green & Dark Gray) -->
            <div class="flex items-center space-x-4 sm:space-x-6">
                <button id="prev" class="text-gray-400 hover:text-[#007AFF] hover:scale-110 transition-all focus:outline-none"><i class="fas fa-step-backward text-sm sm:text-lg"></i></button>
                <button id="play-pause" class="w-12 h-12 sm:w-14 sm:h-14 bg-[#D4FF00] text-black rounded-full flex items-center justify-center hover:scale-110 transition-all focus:outline-none shadow-[0_4px_15px_rgba(212,255,0,0.4)]"><i id="play-icon" class="fas fa-play ml-1 text-lg"></i></button>
                <button id="next" class="text-gray-400 hover:text-[#007AFF] hover:scale-110 transition-all focus:outline-none"><i class="fas fa-step-forward text-sm sm:text-lg"></i></button>
            </div>
            
        </div>
    </div>

    <!-- Hidden YouTube Player Container (Crucial for audio) -->
    <div id="player-container" class="hidden">
        <div id="yt-player"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // --- THEME DATA & SWITCHING LOGIC ---
        let currentTheme = 'lofi'; 
        const themes = {
            lofi: {
                playlistId: 'PLblc3VxTs80U',
                landscapeVideo: 'landscape.mp4',
                portraitVideo: 'potrate.mp4',
                btnIcon: 'fa-dumbbell',
                btnText: 'Switch to Gym'
            },
            gym: {
                playlistId: 'PLQ4Jwqf6GX0U',
                landscapeVideo: 'gym landscape.mp4',
                portraitVideo: 'gym potrate.mp4',
                btnIcon: 'fa-coffee',
                btnText: 'Switch to Lofi'
            }
        };

        // --- GLOBAL VARIABLES ---
        let player, isPlaying = false, progressInterval, shelvesBuilt = false, hasEntered = false;
        let internetRetryTimeout = null; 
        const BUFFER_TIMEOUT_MS = 12000; // 12 seconds allowed for buffering before auto-retry

        // --- YOUTUBE PLAYER INITIALIZATION ---
        function initYouTubePlayer(playlistId, isSwitching = false) {
            player = new YT.Player('yt-player', {
                height: '0', width: '0',
                playerVars: { listType: 'playlist', list: playlistId, autoplay: 0, controls: 0, disablekb: 1, fs: 0 },
                events: { 
                    'onReady': (e) => {
                        if (isSwitching && hasEntered) {
                            e.target.setVolume(70);
                            setTimeout(() => {
                                e.target.setShuffle(true);
                                e.target.playVideoAt(0);
                            }, 500);
                        }
                    }, 
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError // Handle actual stream breaks
                }
            });
        }

        function onYouTubeIframeAPIReady() {
            initYouTubePlayer(themes[currentTheme].playlistId, false);
        }

        // --- SLOW INTERNET / ERROR RECOVERY HANDLERS ---
        function onPlayerError(event) {
            console.warn("YouTube Stream Error Detected. Auto-skipping to recover...", event.data);
            document.getElementById('song-artist').innerText = "Reconnecting stream...";
            setTimeout(() => {
                if (player && typeof player.nextVideo === 'function') {
                    player.nextVideo();
                }
            }, 2000);
        }

        function handleSlowInternetRetry() {
            console.log("Stream stuck buffering. Forcing a background reload...");
            document.getElementById('song-artist').innerText = "Buffering... Re-syncing stream";
            if (player && typeof player.getCurrentTime === 'function') {
                const currentTime = player.getCurrentTime();
                player.seekTo(currentTime, true);
                player.playVideo();
            }
        }

        // --- BUTTON EVENT LISTENERS ---
        document.getElementById('enter-btn').addEventListener('click', () => {
            hasEntered = true;
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.visibility = 'hidden';
                document.getElementById('splash').style.display = 'none';
            }, 500);
            
            player.setVolume(70);
            setTimeout(() => {
                player.setShuffle(true); 
                player.playVideoAt(0);
            }, 500); 
        });

        document.getElementById('theme-switch-btn').addEventListener('click', () => {
            currentTheme = currentTheme === 'lofi' ? 'gym' : 'lofi';
            const theme = themes[currentTheme];

            document.getElementById('theme-switch-btn').innerHTML = `<i class="fas ${theme.btnIcon} mr-2.5"></i> <span id="theme-btn-text">${theme.btnText}</span>`;

            const videos = [
                { id: 'blur-landscape', src: theme.landscapeVideo },
                { id: 'blur-portrait', src: theme.portraitVideo },
                { id: 'main-landscape', src: theme.landscapeVideo },
                { id: 'main-portrait', src: theme.portraitVideo }
            ];
            videos.forEach(v => {
                const vidEl = document.getElementById(v.id);
                if (vidEl) {
                    vidEl.src = v.src;
                    vidEl.load(); 
                    vidEl.play();
                }
            });

            shelvesBuilt = false;
            document.getElementById('shelf-left').innerHTML = '';
            document.getElementById('shelf-right').innerHTML = '';
            document.getElementById('song-title').innerText = "Loading Station...";
            document.getElementById('song-artist').innerText = "Connecting to YouTube...";
            
            clearTimeout(internetRetryTimeout);

            if (player && typeof player.destroy === 'function') {
                player.destroy();
            }
            document.getElementById('player-container').innerHTML = '<div id="yt-player"></div>'; 
            initYouTubePlayer(theme.playlistId, true);
        });

        document.getElementById('play-pause').addEventListener('click', () => {
            if (isPlaying) {
                player.pauseVideo();
                clearTimeout(internetRetryTimeout); // Prevent auto-retry if user intentionally paused
            } else {
                player.playVideo();
            }
        });
        
        document.getElementById('prev').addEventListener('click', () => player.previousVideo());
        document.getElementById('next').addEventListener('click', () => player.nextVideo());
        document.getElementById('progress-container').addEventListener('click', function(e) {
            if(player && player.getDuration) {
                const rect = this.getBoundingClientRect();
                player.seekTo(( (e.clientX - rect.left) / rect.width ) * player.getDuration(), true);
            }
        });

        // --- LIVE CLOCK ---
        setInterval(() => {
            const now = new Date();
            let hours = now.getHours(), minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            document.getElementById('clock').innerText = hours + ':' + (minutes < 10 ? '0' + minutes : minutes) + ' ' + ampm;
        }, 1000);

        // --- AUTO-DETECT BLURRED AREA & SHELVES ---
        function calculateShelves() {
            const isLandscape = window.innerWidth > window.innerHeight;
            const shelfLeft = document.getElementById('shelf-left');
            const shelfRight = document.getElementById('shelf-right');
            
            shelfLeft.style.display = 'none'; 
            shelfRight.style.display = 'none';

            if (!isLandscape) return; 

            const video = document.getElementById('main-landscape');
            if (!video || !video.videoWidth) return;

            const winW = video.clientWidth;
            const winH = video.clientHeight;
            const winAR = winW / winH;
            const vidAR = video.videoWidth / video.videoHeight;
            
            const MIN_SHELF_SIZE = 65; 

            if (winAR > vidAR + 0.02) {
                const vidRenderW = winH * vidAR;
                const blankW = (winW - vidRenderW) / 2;
                
                if (blankW >= MIN_SHELF_SIZE) {
                    shelfLeft.style.display = 'flex'; shelfLeft.style.width = `${blankW + 2}px`; 
                    shelfRight.style.display = 'flex'; shelfRight.style.width = `${blankW + 2}px`;
                }
            }
        }

        window.addEventListener('resize', calculateShelves);
        document.querySelectorAll('.main-vid').forEach(v => {
            v.addEventListener('loadedmetadata', calculateShelves);
            if (v.readyState >= 1) calculateShelves(); 
        });

        function buildShelves() {
            if (shelvesBuilt) return;
            
            const playlist = player.getPlaylist();
            if (!playlist || playlist.length === 0) {
                setTimeout(buildShelves, 500); 
                return; 
            }

            document.getElementById('shelf-left').innerHTML = '';
            document.getElementById('shelf-right').innerHTML = '';

            const createDisk = (index, vidId) => {
                const w = document.createElement('div'); w.className = 'disk-wrapper';
                const d = document.createElement('div'); d.className = 'disk'; d.title = "Play Song";
                d.onclick = () => player.playVideoAt(index);
                const i = document.createElement('img'); i.src = 'https://img.youtube.com/vi/' + vidId + '/hqdefault.jpg';
                d.appendChild(i); w.appendChild(d); return w;
            };

            playlist.forEach((vidId, index) => {
                if (index % 2 === 0) document.getElementById('shelf-left').appendChild(createDisk(index, vidId));
                else document.getElementById('shelf-right').appendChild(createDisk(index, vidId));
            });
            
            shelvesBuilt = true;
            setTimeout(calculateShelves, 100); 
        }

        // --- UPDATE UI ON SONG CHANGE ---
        function onPlayerStateChange(event) {
            const playIcon = document.getElementById('play-icon'), thumb = document.getElementById('album-art');
            
            // Clear any active retry timeouts anytime the state changes
            clearTimeout(internetRetryTimeout);

            if (event.data == YT.PlayerState.PLAYING) {
                isPlaying = true;
                
                if (!shelvesBuilt) buildShelves(); 
                
                playIcon.classList.replace('fa-play', 'fa-pause'); playIcon.classList.remove('ml-1'); 
                thumb.classList.replace('spin-paused', 'spin-slow');
                
                let data = player.getVideoData();
                document.getElementById('song-title').innerText = data.title || "Loading Title...";
                document.getElementById('song-artist').innerText = data.author || "Loading Artist...";
                document.getElementById('album-art').src = 'https://img.youtube.com/vi/' + data.video_id + '/hqdefault.jpg';
                
                clearInterval(progressInterval);
                progressInterval = setInterval(() => {
                    if(player && player.getDuration) document.getElementById('progress-fill').style.width = ((player.getCurrentTime() / player.getDuration()) * 100) + '%';
                }, 1000);

            } else if (event.data == YT.PlayerState.BUFFERING) {
                // Video is buffering - likely due to slow internet. Start the retry clock.
                internetRetryTimeout = setTimeout(handleSlowInternetRetry, BUFFER_TIMEOUT_MS);
                
            } else {
                // Paused, Ended, Unstarted, or Cued
                isPlaying = false;
                playIcon.classList.replace('fa-pause', 'fa-play'); playIcon.classList.add('ml-1'); 
                thumb.classList.replace('spin-slow', 'spin-paused');
                clearInterval(progressInterval);
            }
        }
    </script>
</body>
</html>
